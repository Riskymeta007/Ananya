<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Quiz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #4a148c 0%, #6a1b9a 50%, #8e24aa 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }
    
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.05) 35px, rgba(255,255,255,.05) 70px);
      z-index: 1;
    }
    
    .falling-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    
    .heart {
      position: absolute;
      width: 30px;
      height: 30px;
      top: -50px;
      animation: fall-heart linear infinite;
      opacity: 0.8;
    }
    
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 48px;
      background: #ce93d8;
      border-radius: 30px 30px 0 0;
    }
    
    .heart::before {
      left: 15px;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }
    
    .heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }
    
    @keyframes fall-heart {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
    
    .walking-cat-container {
      position: fixed;
      bottom: 20%;
      left: 0;
      width: 100%;
      height: 100px;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }
    
    .walking-cat {
      position: absolute;
      font-size: 5rem;
      animation: walkAcross 15s linear infinite;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
    }
    
    @keyframes walkAcross {
      0% {
        left: -100px;
        transform: scaleX(1);
      }
      48% {
        left: calc(100% - 50px);
        transform: scaleX(1);
      }
      50% {
        left: calc(100% - 50px);
        transform: scaleX(-1);
      }
      98% {
        left: -100px;
        transform: scaleX(-1);
      }
      100% {
        left: -100px;
        transform: scaleX(1);
      }
    }
    
    .content {
      position: relative;
      z-index: 100;
      width: 100%;
      max-width: 900px;
    }
    
    #memoryQuestion {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ab47bc, #ce93d8, #ab47bc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 50px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      animation: shimmer 3s ease-in-out infinite;
      background-size: 200% auto;
      line-height: 1.4;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(74, 20, 140, 0.4);
      border: 3px solid #ce93d8;
    }
    
    @keyframes shimmer {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }
    
    .options-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }
    
    .option-item {
      background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
      border-radius: 25px;
      padding: 30px 25px;
      box-shadow: 0 8px 25px rgba(74, 20, 140, 0.3);
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      text-align: center;
      border: 4px solid #ce93d8;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    
    .option-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(171, 71, 188, 0.2), transparent);
      transition: left 0.5s;
    }
    
    .option-item:hover::before {
      left: 100%;
    }
    
    .option-item:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 15px 40px rgba(171, 71, 188, 0.5);
      border-color: #ab47bc;
    }
    
    .option-item input[type="radio"] {
      display: none;
    }
    
    .option-item input[type="radio"]:checked + label {
      background: linear-gradient(135deg, #ab47bc, #ce93d8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .option-item label {
      display: block;
      font-size: 1.4rem;
      font-weight: 700;
      color: #4a148c;
      cursor: pointer;
      padding: 15px;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .option-emoji {
      font-size: 3rem;
      margin-bottom: 15px;
      display: block;
      animation: bounce 2s ease-in-out infinite;
    }
    
    .option-item:nth-child(1) .option-emoji { animation-delay: 0s; }
    .option-item:nth-child(2) .option-emoji { animation-delay: 0.2s; }
    .option-item:nth-child(3) .option-emoji { animation-delay: 0.4s; }
    .option-item:nth-child(4) .option-emoji { animation-delay: 0.6s; }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .button {
      display: block;
      margin: 0 auto;
      font-size: 1.6rem;
      font-weight: bold;
      padding: 20px 60px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #ab47bc, #ce93d8);
      color: white;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 8px 25px rgba(74, 20, 140, 0.4);
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 4px solid #e1bee7;
      position: relative;
      overflow: hidden;
    }
    
    .button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .button:hover::after {
      width: 400px;
      height: 400px;
    }
    
    .button:hover {
      transform: scale(1.1) translateY(-5px);
      box-shadow: 0 12px 40px rgba(171, 71, 188, 0.6);
    }
    
    .button:active {
      transform: scale(1.05);
    }
    
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(74, 20, 140, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.3s ease;
    }
    
    .popup-overlay.show {
      display: flex;
    }
    
    .popup-box {
      background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
      padding: 60px 70px;
      border-radius: 40px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      text-align: center;
      max-width: 90%;
      animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      border: 5px solid #ab47bc;
      position: relative;
    }
    
    .popup-emoji {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: heartBeat 1s ease infinite;
    }
    
    .popup-message {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ab47bc, #ce93d8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.6;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .popup-button {
      background: linear-gradient(135deg, #ab47bc, #ce93d8);
      color: white;
      border: none;
      padding: 18px 45px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(171, 71, 188, 0.5);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .popup-button:hover {
      background: linear-gradient(135deg, #8e24aa, #ab47bc);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(171, 71, 188, 0.7);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes popIn {
      0% {
        transform: scale(0.3) rotate(-180deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      75% { transform: scale(1.2); }
    }
    
    @media (max-width: 768px) {
      #memoryQuestion {
        font-size: 1.8rem;
        padding: 20px;
      }
      
      .walking-cat {
        font-size: 3.5rem;
      }
      
      .options-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .option-item label {
        font-size: 1.1rem;
      }
      
      .button {
        font-size: 1.2rem;
        padding: 16px 40px;
      }
    }
  </style>
</head>
<body>
  <div class="falling-hearts" id="fallingHearts"></div>
  
  <div class="walking-cat-container">
    <div class="walking-cat">🐈</div>
  </div>
  
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-emoji" id="popupEmoji">😍</div>
      <div class="popup-message" id="popupMessage">
        BRATHIKIPOYAV MEOW 😍
      </div>
      <button class="popup-button" onclick="closePopupAndContinue()">
        Continue 💜
      </button>
    </div>
  </div>
  
  <div class="content">
    <div id="memoryQuestion">
      <b>Do you remember the date and day<br>we met for the 1st time? 💕</b>
    </div>
    
    <div class="options-container">
      <div class="option-item" onclick="selectOption(this)">
        <span class="option-emoji">📅</span>
        <input type="radio" name="meetDate" value="13th January 2022 Tuesday" id="option1" />
        <label for="option1">13th January 2022<br>Tuesday</label>
      </div>
      
      <div class="option-item" onclick="selectOption(this)">
        <span class="option-emoji">📆</span>
        <input type="radio" name="meetDate" value="6th February 2022" id="option2" />
        <label for="option2">6th February 2022<br>Sunday</label>
      </div>
      
      <div class="option-item" onclick="selectOption(this)">
        <span class="option-emoji">🗓️</span>
        <input type="radio" name="meetDate" value="13th June 2022" id="option3" />
        <label for="option3">13th June 2022<br>Monday</label>
      </div>
      
      <div class="option-item" onclick="selectOption(this)">
        <span class="option-emoji">😿</span>
        <input type="radio" name="meetDate" value="I don't remember at all" id="option4" />
        <label for="option4">I don't remember<br>at all 😿</label>
      </div>
    </div>
    
    <button class="button" onclick="checkAnswer()">
      Continue 😻
    </button>
  </div>
  
  <script>
    const heartsContainer = document.getElementById('fallingHearts');
    const numHearts = 40;
    
    for (let i = 0; i < numHearts; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      
      const leftPos = Math.random() * 100;
      const duration = 5 + Math.random() * 5;
      const delay = Math.random() * 5;
      const scale = 0.5 + Math.random() * 0.8;
      
      heart.style.left = `${leftPos}%`;
      heart.style.animationDuration = `${duration}s`;
      heart.style.animationDelay = `${delay}s`;
      heart.style.transform = `scale(${scale})`;
      
      heartsContainer.appendChild(heart);
    }
    
    function selectOption(element) {
      document.querySelectorAll('.option-item').forEach(item => {
        item.style.background = 'linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%)';
        item.style.borderColor = '#ce93d8';
      });
      
      element.style.background = 'linear-gradient(135deg, #e1bee7 0%, #d1c4e9 100%)';
      element.style.borderColor = '#ab47bc';
      
      element.querySelector('input[type="radio"]').checked = true;
    }
    
    function checkAnswer() {
      const selectedOption = document.querySelector('input[name="meetDate"]:checked');
      
      if (!selectedOption) {
        alert('Please select an answer first! 💜');
        return;
      }
      
      const popupOverlay = document.getElementById('popupOverlay');
      const popupEmoji = document.getElementById('popupEmoji');
      const popupMessage = document.getElementById('popupMessage');
      
      if (selectedOption.id === 'option3') {
        popupEmoji.textContent = '😍';
        popupMessage.textContent = 'BRATHIKIPOYAV MEOW 😍';
      } else {
        popupEmoji.textContent = '😾';
        popupMessage.textContent = 'HOW DARE YOU! 😾';
      }
      
      popupOverlay.classList.add('show');
    }
    
    function closePopupAndContinue() {
      document.getElementById('popupOverlay').classList.remove('show');
      
      setTimeout(function() {
        window.location.href = 'dessert.html';
      }, 300);
    }
  </script>
</body>
</html>
