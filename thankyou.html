<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #2c1810 0%, #4a2c1f 50%, #6b4423 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    
    /* Background pattern */
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.03) 35px, rgba(255,255,255,.03) 70px);
      z-index: 1;
    }
    
    /* Multiple cats positioned around the screen */
    .cats-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    
    .cat {
      position: absolute;
      font-size: 3.5rem;
      animation: gentle-sway 3s ease-in-out infinite;
    }
    
    /* Positioning 12 cats around the screen */
    .cat:nth-child(1) { top: 5%; left: 8%; animation-delay: 0s; }
    .cat:nth-child(2) { top: 8%; left: 25%; animation-delay: 0.5s; }
    .cat:nth-child(3) { top: 10%; right: 25%; animation-delay: 1s; }
    .cat:nth-child(4) { top: 7%; right: 8%; animation-delay: 1.5s; }
    .cat:nth-child(5) { top: 35%; left: 3%; animation-delay: 0.3s; }
    .cat:nth-child(6) { top: 35%; right: 3%; animation-delay: 0.8s; }
    .cat:nth-child(7) { top: 60%; left: 5%; animation-delay: 1.2s; }
    .cat:nth-child(8) { top: 60%; right: 5%; animation-delay: 1.7s; }
    .cat:nth-child(9) { bottom: 12%; left: 10%; animation-delay: 0.6s; }
    .cat:nth-child(10) { bottom: 10%; left: 30%; animation-delay: 1.1s; }
    .cat:nth-child(11) { bottom: 8%; right: 30%; animation-delay: 1.6s; }
    .cat:nth-child(12) { bottom: 15%; right: 10%; animation-delay: 0.2s; }
    
    .cat::before {
      content: '🐱';
    }
    
    @keyframes gentle-sway {
      0%, 100% { transform: rotate(-3deg) translateY(0px); }
      50% { transform: rotate(3deg) translateY(-5px); }
    }
    
    /* Octagonal tile format */
    .content {
      position: relative;
      z-index: 100;
      text-align: center;
      background: linear-gradient(135deg, #fff9f5 0%, #ffe8d6 100%);
      padding: 30px 40px;
      clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
      box-shadow: 
        0 25px 70px rgba(0, 0, 0, 0.5),
        inset 0 2px 0 rgba(255, 255, 255, 0.7),
        0 0 0 6px #d4a574,
        0 0 0 8px #8b6f47;
      max-width: 600px;
      animation: floatCard 6s ease-in-out infinite;
    }
    
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    /* Decorative corners */
    .corner-decoration {
      position: absolute;
      font-size: 2rem;
      opacity: 0.6;
    }
    
    .corner-decoration:nth-child(1) { top: 10px; left: 10px; }
    .corner-decoration:nth-child(2) { top: 10px; right: 10px; }
    .corner-decoration:nth-child(3) { bottom: 10px; left: 10px; }
    .corner-decoration:nth-child(4) { bottom: 10px; right: 10px; }
    
    .cat-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
      letter-spacing: 1px;
    }
    
    #thankyou {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff6b35, #f7931e, #ff6b35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 3px;
      animation: shimmer 3s ease-in-out infinite;
      background-size: 200% auto;
    }
    
    @keyframes shimmer {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }
    
    .divider {
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff6b35, transparent);
      margin: 15px auto;
      border-radius: 10px;
    }
    
    /* Cool Cat Image Container */
    .cool-cat-container {
      margin: 15px 0;
      position: relative;
    }
    
    .cool-cat-image {
      max-width: 100%;
      width: 250px;
      height: auto;
      border-radius: 20px;
      border: 5px solid #d4a574;
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.4),
        0 0 0 2px #8b6f47;
      animation: coolCatPulse 3s ease-in-out infinite;
      display: block;
      margin: 0 auto;
    }
    
    @keyframes coolCatPulse {
      0%, 100% { 
        transform: scale(1) rotate(0deg);
        box-shadow: 
          0 15px 40px rgba(0, 0, 0, 0.4),
          0 0 0 2px #8b6f47,
          0 0 20px rgba(255, 107, 53, 0.3);
      }
      50% { 
        transform: scale(1.03) rotate(1deg);
        box-shadow: 
          0 20px 50px rgba(0, 0, 0, 0.5),
          0 0 0 2px #8b6f47,
          0 0 30px rgba(255, 107, 53, 0.5);
      }
    }
    
    .cool-cat-caption {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 15px 0 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: bounce 1.5s ease infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .button {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 15px 40px;
      margin-top: 15px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 4px solid #d4a574;
      position: relative;
      overflow: hidden;
    }
    
    .button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .button:hover::after {
      width: 300px;
      height: 300px;
    }
    
    .button:hover {
      transform: scale(1.15) translateY(-5px);
      box-shadow: 0 12px 40px rgba(247, 147, 30, 0.6);
    }
    
    .button:active {
      transform: scale(1.05) translateY(0);
    }
    
    .footer-decoration {
      margin-top: 15px;
      font-size: 1.3rem;
      opacity: 0.7;
      animation: pawPrint 2s ease-in-out infinite;
    }
    
    @keyframes pawPrint {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }
    
    @media (max-width: 768px) {
      .content {
        padding: 40px 30px;
        clip-path: polygon(5% 0%, 95% 0%, 100% 5%, 100% 95%, 95% 100%, 5% 100%, 0% 95%, 0% 5%);
      }
      
      #thankyou {
        font-size: 2.2rem;
      }
      
      .cat {
        font-size: 2.5rem;
      }
      
      .cool-cat-image {
        width: 300px;
      }
      
      h1 {
        font-size: 1.6rem;
      }
      
      .button {
        font-size: 1.2rem;
        padding: 16px 40px;
      }
    }
  </style>
</head>
<body>
  <!-- Multiple cats around the screen -->
  <div class="cats-container">
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
  </div>
  
  <div class="content">
    <div class="corner-decoration">🐾</div>
    <div class="corner-decoration">🐾</div>
    <div class="corner-decoration">🐾</div>
    <div class="corner-decoration">🐾</div>
    
    <div class="cat-badge">💕 YAYY! 💕</div>
    
    <div id="thankyou"><b>Thank You!</b></div>
    
    <div class="divider"></div>
    
    <!-- Cool Cat Image facing straight at viewer -->
    <div class="cool-cat-container">
      <img src="OIP.webp" alt="Cool Cat with Sunglasses" class="cool-cat-image" />
      <div class="cool-cat-caption">😎 TOO COOL FOR SCHOOL 😎</div>
    </div>
    
    <div class="divider"></div>
    
    <h1>Don't go yet!</h1>
    
    <button class="button" onclick="location.href='date.html'">
      Click me! 😻
    </button>
    
    <div class="footer-decoration">🐾 🐾 🐾</div>
  </div>
</body>
</html>
