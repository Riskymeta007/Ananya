<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #ff7675 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    .falling-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    
    .heart {
      position: absolute;
      width: 30px;
      height: 30px;
      top: -50px;
      animation: fall-heart linear infinite;
      opacity: 0.6;
    }
    
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 48px;
      background: #ff6b9d;
      border-radius: 30px 30px 0 0;
    }
    
    .heart::before {
      left: 15px;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }
    
    .heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }
    
    @keyframes fall-heart {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
    
    .content {
      position: relative;
      z-index: 100;
      text-align: center;
      display: none;
    }
    
    .content.show {
      display: block;
      animation: fadeIn 1s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    
    #thankyouMessage {
      font-size: 3rem;
      font-weight: bold;
      color: #ff1744;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      margin-bottom: 40px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .cat-emoji {
      font-size: 15rem;
      animation: bounce 2s ease-in-out infinite;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    
    #meterModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    
    #meterModal.show {
      display: flex !important;
      animation: fadeIn 0.5s ease;
    }
    
    .meter-content {
      background: linear-gradient(135deg, #fff 0%, #ffe4e9 100%);
      padding: 50px 40px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 10px 50px rgba(255, 107, 157, 0.5);
      border: 5px solid #ff1744;
      max-width: 600px;
      width: 90%;
      animation: slideIn 0.6s ease;
      position: relative;
    }
    
    @keyframes slideIn {
      from {
        transform: translateY(-100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .meter-content h2 {
      color: #ff1744;
      font-size: 2.5rem;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }
    
    .meter-container {
      width: 100%;
      height: 50px;
      background: #f0f0f0;
      border-radius: 25px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 3px solid #ff6b9d;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
      padding: 4px;
    }
    
    .meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6b9d 0%, #ff1744 100%);
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 25px;
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.6);
      position: relative;
      overflow: hidden;
    }
    
    .meter-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      transform: translateX(-100%);
      animation: shimmer 1.5s infinite;
    }
    
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
    
    .meter-text {
      font-size: 1.3rem;
      color: #ff1744;
      font-weight: bold;
      margin-bottom: 20px;
    }
    
    .hold-meter-btn {
      background: linear-gradient(135deg, #ff6b9d, #ff1744);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 23, 68, 0.4);
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 15px;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .hold-meter-btn:active {
      transform: scale(0.95);
    }
    
    .close-meter-btn {
      background: linear-gradient(135deg, #ff6b9d, #ff1744);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 23, 68, 0.4);
      transition: all 0.3s ease;
    }
    
    .close-meter-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 23, 68, 0.6);
    }
    
    .close-meter-btn:active {
      transform: translateY(0);
    }
    
    #promiseMessage {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 3000;
      align-items: center;
      justify-content: center;
    }
    
    #promiseMessage.show {
      display: flex !important;
      animation: fadeIn 0.5s ease;
    }
    
    .promise-content {
      background: linear-gradient(135deg, #fff5f7 0%, #ffe4e9 100%);
      padding: 60px 50px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 10px 50px rgba(255, 107, 157, 0.7);
      border: 6px solid #ff1744;
      max-width: 700px;
      width: 90%;
      animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    @keyframes popIn {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    
    .promise-content h2 {
      color: #ff1744;
      font-size: 2.8rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      line-height: 1.4;
      animation: wiggle 1.5s ease-in-out infinite;
    }
    
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }
    
    .promise-cat {
      font-size: 8rem;
      margin: 20px 0;
      animation: heartbeat 1.5s ease-in-out infinite;
    }
    
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      10% { transform: scale(1.1); }
      20% { transform: scale(1); }
      30% { transform: scale(1.1); }
      40% { transform: scale(1); }
    }
    
    @media (max-width: 768px) {
      #thankyouMessage {
        font-size: 2rem;
      }
      
      .cat-emoji {
        font-size: 10rem;
      }
      
      .meter-content {
        padding: 30px 20px;
      }
      
      .meter-content h2 {
        font-size: 2rem;
      }
      
      .meter-text {
        font-size: 1.2rem;
      }
      
      .promise-content {
        padding: 40px 30px;
      }
      
      .promise-content h2 {
        font-size: 2rem;
      }
      
      .promise-cat {
        font-size: 5rem;
      }
    }
  </style>
</head>
<body>
  <div class="falling-hearts" id="fallingHearts"></div>
  
  <div class="content" id="mainContent">
    <div id="thankyouMessage">Thank You 💕</div>
    <div class="cat-emoji">🐱</div>
  </div>
  
  <div id="meterModal">
    <div class="meter-content">
      <h2>Missing You Meter 💔</h2>
      <div class="meter-container">
        <div class="meter-fill" id="meterFill"></div>
      </div>
      <div class="meter-text" id="meterText">Press & Hold to fill! 💕</div>
      <button class="hold-meter-btn" id="holdBtn">HOLD TO FILL</button>
      <button class="close-meter-btn" id="closeBtn" style="display:none;" onclick="closeMeter()">Close</button>
    </div>
  </div>
  
  <div id="promiseMessage">
    <div class="promise-content">
      <h2>Promise me you won't leave this meow side no matter what</h2>
      <div class="promise-cat">🐱💕</div>
    </div>
  </div>
  
  <script>
    const container = document.getElementById('fallingHearts');
    const numHearts = 40;
    
    for (let i = 0; i < numHearts; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      
      const leftPos = Math.random() * 100;
      const duration = 5 + Math.random() * 5;
      const delay = Math.random() * 5;
      const scale = 0.5 + Math.random() * 0.8;
      
      heart.style.left = `${leftPos}%`;
      heart.style.animationDuration = `${duration}s`;
      heart.style.animationDelay = `${delay}s`;
      heart.style.transform = `scale(${scale})`;
      heart.style.filter = `hue-rotate(${Math.random() * 30}deg)`;
      
      container.appendChild(heart);
    }
    
    document.getElementById('mainContent').classList.add('show');
    
    setTimeout(function() {
      document.getElementById('meterModal').classList.add('show');
    }, 3000);
    
    const holdBtn = document.getElementById('holdBtn');
    const meterFill = document.getElementById('meterFill');
    const meterText = document.getElementById('meterText');
    const closeBtn = document.getElementById('closeBtn');
    
    let progress = 0;
    let interval;
    
    const startFilling = (e) => {
      if (e.type === 'touchstart') e.preventDefault();
      holdBtn.style.transform = "scale(0.95)";
      
      interval = setInterval(() => {
        if (progress < 100) {
          progress += 2;
          meterFill.style.width = progress + "%";
          
          if (progress > 20) meterText.textContent = "Keep holding... 💕";
          if (progress > 50) meterText.textContent = "Missing you more... 💔";
          if (progress > 80) meterText.textContent = "Almost there... ✨";
        } else {
          clearInterval(interval);
          meterText.textContent = "100% Missing You! 😢";
          holdBtn.style.display = 'none';
          closeBtn.style.display = 'block';
        }
      }, 30);
    };
    
    const stopFilling = () => {
      clearInterval(interval);
      holdBtn.style.transform = "scale(1)";
      if (progress < 100 && progress > 0) {
        meterText.textContent = "Don't let go! Keep holding! 🥺";
      }
    };
    
    holdBtn.addEventListener('mousedown', startFilling);
    holdBtn.addEventListener('touchstart', startFilling, { passive: false });
    holdBtn.addEventListener('mouseup', stopFilling);
    holdBtn.addEventListener('mouseleave', stopFilling);
    holdBtn.addEventListener('touchend', stopFilling);
    
    function closeMeter() {
      clearInterval(interval);
      document.getElementById('meterModal').classList.remove('show');
      
      setTimeout(function() {
        document.getElementById('promiseMessage').classList.add('show');
        
        setTimeout(function() {
          document.getElementById('promiseMessage').classList.remove('show');
          
          setTimeout(function() {
            showTeaserMessage();
          }, 500);
        }, 10000);
      }, 500);
    }
    
    function showTeaserMessage() {
      const teaserDiv = document.createElement('div');
      teaserDiv.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 4000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.5s ease;
      `;
      
      teaserDiv.innerHTML = `
        <div style="
          background: linear-gradient(135deg, #fff5f7 0%, #ffe4e9 100%);
          padding: 60px 50px;
          border-radius: 30px;
          text-align: center;
          box-shadow: 0 10px 50px rgba(255, 107, 157, 0.7);
          border: 6px solid #ff1744;
          max-width: 700px;
          width: 90%;
          animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        ">
          <h2 style="
            color: #ff1744;
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            line-height: 1.4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
          ">You think that's it? 😏</h2>
          <p style="
            font-size: 2rem;
            color: #ff1744;
            font-weight: bold;
            margin: 20px 0;
          ">Very Bad of you! 😤</p>
          <p style="
            font-size: 1.5rem;
            color: #ff6b9d;
            font-weight: 600;
            font-style: italic;
          ">Inka undhi... 💕</p>
          <div style="font-size: 5rem; margin: 20px 0;">😼</div>
        </div>
      `;
      
      document.body.appendChild(teaserDiv);
      
      setTimeout(function() {
        window.location.href = 'final-video.html';
      }, 3000);
    }
  </script>
</body>
</html>
