<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Meowlentine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #2c1810 0%, #4a2c1f 50%, #6b4423 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }
    
    /* Background pattern */
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.03) 35px, rgba(255,255,255,.03) 70px);
      z-index: 1;
    }
    
    /* Stagnant cats positioned around the screen */
    .cats-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    
    .cat {
      position: absolute;
      font-size: 4rem;
      animation: blink 4s infinite;
    }
    
    .cat:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
    .cat:nth-child(2) { top: 15%; right: 12%; animation-delay: 1s; }
    .cat:nth-child(3) { bottom: 15%; left: 8%; animation-delay: 2s; }
    .cat:nth-child(4) { bottom: 20%; right: 10%; animation-delay: 0.5s; }
    .cat:nth-child(5) { top: 50%; left: 5%; animation-delay: 1.5s; }
    .cat:nth-child(6) { top: 45%; right: 5%; animation-delay: 2.5s; }
    
    .cat::before {
      content: '🐱';
    }
    
    @keyframes blink {
      0%, 45%, 50%, 95%, 100% {
        transform: scaleY(1);
      }
      47.5%, 97.5% {
        transform: scaleY(0.1);
      }
    }
    
    /* NEW TILE FORMAT - Hexagonal/Diamond shape */
    .content {
      position: relative;
      z-index: 100;
      text-align: center;
      background: linear-gradient(135deg, #fff9f5 0%, #ffe8d6 100%);
      padding: 60px 80px;
      clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
      box-shadow: 
        0 25px 70px rgba(0, 0, 0, 0.5),
        inset 0 2px 0 rgba(255, 255, 255, 0.7),
        0 0 0 6px #d4a574,
        0 0 0 8px #8b6f47;
      max-width: 650px;
      animation: floatCard 6s ease-in-out infinite;
    }
    
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    /* Decorative corners */
    .corner-decoration {
      position: absolute;
      font-size: 2rem;
      opacity: 0.6;
    }
    
    .corner-decoration:nth-child(1) { top: 10px; left: 10px; }
    .corner-decoration:nth-child(2) { top: 10px; right: 10px; }
    .corner-decoration:nth-child(3) { bottom: 10px; left: 10px; }
    .corner-decoration:nth-child(4) { bottom: 10px; right: 10px; }
    
    .header-section {
      margin-bottom: 30px;
      position: relative;
    }
    
    .cat-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      padding: 10px 25px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
      letter-spacing: 1px;
    }
    
    #valentineQuestion {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff6b35, #f7931e, #ff6b35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: shimmer 3s ease-in-out infinite;
      background-size: 200% auto;
    }
    
    @keyframes shimmer {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }
    
    .divider {
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff6b35, transparent);
      margin: 25px auto;
      border-radius: 10px;
    }
    
    .cat-icon-container {
      margin: 30px 0;
      position: relative;
    }
    
    .cat-icon {
      font-size: 6rem;
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0px) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }
    
    .buttons-section {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .answerButton {
      font-size: 1.6rem;
      font-weight: bold;
      padding: 20px 50px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .answerButton::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .answerButton:hover::after {
      width: 300px;
      height: 300px;
    }
    
    #yesButton {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      border: 4px solid #d4a574;
      position: relative;
      z-index: 1;
    }
    
    #yesButton:hover {
      transform: scale(1.15) translateY(-5px);
      box-shadow: 0 12px 40px rgba(247, 147, 30, 0.6);
    }
    
    #noButton {
      background: linear-gradient(135deg, #d4a574, #b8936c);
      color: #2c1810;
      border: 4px solid #8b6f47;
    }
    
    #noButton:hover {
      transform: scale(0.9) translateY(2px);
    }
    
    .footer-decoration {
      margin-top: 35px;
      font-size: 1.8rem;
      opacity: 0.7;
      animation: pawPrint 2s ease-in-out infinite;
    }
    
    @keyframes pawPrint {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }
    
    @media (max-width: 768px) {
      .content {
        padding: 40px 30px;
        clip-path: polygon(5% 0%, 95% 0%, 100% 5%, 100% 95%, 95% 100%, 5% 100%, 0% 95%, 0% 5%);
      }
      
      #valentineQuestion {
        font-size: 1.8rem;
      }
      
      .cat {
        font-size: 3rem;
      }
      
      .cat-icon {
        font-size: 4.5rem;
      }
      
      .answerButton {
        font-size: 1.3rem;
        padding: 16px 40px;
      }
      
      .buttons-section {
        flex-direction: column;
        gap: 15px;
      }
    }
    
    /* Custom Popup Modal */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(44, 24, 16, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.3s ease;
    }
    
    .popup-overlay.show {
      display: flex;
    }
    
    .popup-box {
      background: linear-gradient(135deg, #fff9f5 0%, #ffe8d6 100%);
      padding: 70px 80px;
      clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
      box-shadow: 
        0 25px 90px rgba(0, 0, 0, 0.7),
        0 0 0 6px #ff6b35,
        0 0 0 8px #d4a574;
      text-align: center;
      max-width: 90%;
      animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
    }
    
    .popup-message {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.6;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .popup-cats {
      font-size: 4rem;
      margin: 20px 0;
      animation: heartBeat 1s ease infinite;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes popIn {
      0% {
        transform: scale(0.3) rotate(-180deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      75% { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <!-- Stagnant blinking cats -->
  <div class="cats-container">
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
    <div class="cat"></div>
  </div>
  
  <!-- Custom Popup -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-cats">😻😻😻</div>
      <div class="popup-message">
        NO ANI PRESS CHESI UNTE<br>
        NEE PEEKA NOKKE VADINI.<br>
        GUNTA😎
      </div>
      <div class="popup-cats">😻😻😻</div>
    </div>
  </div>
  
  <div class="content">
    <div class="corner-decoration">🐾</div>
    <div class="corner-decoration">🐾</div>
    <div class="corner-decoration">🐾</div>
    <div class="corner-decoration">🐾</div>
    
    <div class="header-section">
      <div class="cat-badge">💕 SPECIAL QUESTION 💕</div>
      <div id="valentineQuestion">
        <b>Will you be my<br>Meowlentine<br>for life?</b>
      </div>
    </div>
    
    <div class="divider"></div>
    
    <div class="cat-icon-container">
      <div class="cat-icon">🐈</div>
    </div>
    
    <div class="divider"></div>
    
    <div class="buttons-section">
      <button class="answerButton" id="yesButton">
        YES! 😻
      </button>
      <button class="answerButton" id="noButton">
        NO NO 😭
      </button>
    </div>
    
    <div class="footer-decoration">🐾 🐾 🐾</div>
  </div>
  
  <script>
    // Yes button shows custom popup and redirects after 5 seconds
    document.getElementById("yesButton").addEventListener("click", function () {
      console.log("Yes button clicked!");
      
      // Show custom popup
      const popup = document.getElementById('popupOverlay');
      popup.classList.add('show');
      
      // Wait 5 seconds then redirect
      setTimeout(function() {
        window.location.href = 'thankyou.html';
      }, 5000);
    });
    
    // Yes button grows when No is clicked
    document.getElementById("noButton").addEventListener("click", function () {
      var yesButton = document.getElementById('yesButton');
      var currentFontSize = parseInt(window.getComputedStyle(yesButton).fontSize);
      yesButton.style.fontSize = currentFontSize + 10 + "px";
    });
  </script>
</body>
</html>
