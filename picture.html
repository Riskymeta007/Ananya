<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Picture Selection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffeaa7 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Falling paw prints background */
    .falling-paws {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    
    .paw {
      position: absolute;
      width: 40px;
      height: 40px;
      top: -60px;
      animation: fall-paw linear infinite;
      opacity: 0.7;
    }
    
    /* Cat paw print SVG structure */
    .paw::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 16px;
      background: #ff6b9d;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
    }
    
    .paw::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 10px;
      background: #ff6b9d;
      border-radius: 50%;
      top: 0;
      left: 0;
    }
    
    .paw-toe-1 {
      position: absolute;
      width: 8px;
      height: 10px;
      background: #ff6b9d;
      border-radius: 50%;
      top: 2px;
      left: 10px;
    }
    
    .paw-toe-2 {
      position: absolute;
      width: 8px;
      height: 10px;
      background: #ff6b9d;
      border-radius: 50%;
      top: 2px;
      right: 10px;
    }
    
    .paw-toe-3 {
      position: absolute;
      width: 8px;
      height: 10px;
      background: #ff6b9d;
      border-radius: 50%;
      top: 0;
      right: 0;
    }
    
    @keyframes fall-paw {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
    
    .container {
      position: relative;
      z-index: 100;
      width: 100%;
      max-width: 1200px;
    }
    
    fieldset {
      border: 5px solid #ff1744;
      border-radius: 30px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    
    legend {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ff1744;
      padding: 0 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .picture-selection {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      margin-bottom: 40px;
    }
    
    .picture-item {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
      text-align: center;
      border: 3px solid transparent;
      cursor: pointer;
    }
    
    .picture-item:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 35px rgba(255, 107, 157, 0.3);
      border-color: #ff6b9d;
    }
    
    .picture-item.selected {
      border-color: #ff1744;
      background: rgba(255, 107, 157, 0.1);
    }
    
    .picture-placeholder {
      width: 100%;
      height: 200px;
      border-radius: 15px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #f5f5f5 0%, #ffe4e9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #ff6b9d;
    }
    
    .picture-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
      background: #f5f5f5;
    }
    
    .picture-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: #333;
    }
    
    .button {
      display: block;
      margin: 20px auto 0;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 15px 50px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff6b9d, #ff1744);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    
    .button:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(255, 23, 68, 0.4);
    }
    
    .button:active {
      transform: scale(1.05);
    }
    
    /* Popup Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.3s;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .modal-content {
      background: linear-gradient(135deg, #fff 0%, #ffe4e9 100%);
      margin: 15% auto;
      padding: 40px;
      border: 5px solid #ff1744;
      border-radius: 30px;
      width: 80%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.3s;
      position: relative;
    }
    
    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .modal-message {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ff1744;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }
    
    .close-button {
      background: linear-gradient(135deg, #ff6b9d, #ff1744);
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .close-button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(255, 23, 68, 0.4);
    }
    
    @media (max-width: 768px) {
      legend {
        font-size: 1.4rem;
      }
      
      fieldset {
        padding: 25px;
      }
      
      .picture-selection {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      
      .button {
        font-size: 1.2rem;
        padding: 12px 40px;
      }
      
      .modal-content {
        width: 90%;
        padding: 30px;
      }
      
      .modal-message {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="falling-paws" id="fallingPaws"></div>
  
  <div class="container">
    <fieldset>
      <legend>Which one of your pictures is my favourite one's? 💕</legend>
      <div class="picture-selection">
        <div class="picture-item" onclick="selectPicture(1)">
          <img src="images/picture1.jpg" alt="Picture 1" class="picture-image" />
          <div class="picture-label">Picture 1</div>
        </div>
        <div class="picture-item" onclick="selectPicture(2)">
          <img src="images/picture2.jpg" alt="Picture 2" class="picture-image" />
          <div class="picture-label">Picture 2</div>
        </div>
        <div class="picture-item" onclick="selectPicture(3)">
          <img src="images/picture3.jpg" alt="Picture 3" class="picture-image" />
          <div class="picture-label">Picture 3</div>
        </div>
        <div class="picture-item" onclick="selectPicture(4)">
          <img src="images/picture4.jpg" alt="Picture 4" class="picture-image" />
          <div class="picture-label">Picture 4</div>
        </div>
        <div class="picture-item" onclick="selectPicture(5)">
          <img src="images/picture5.jpg" alt="Picture 5" class="picture-image" />
          <div class="picture-label">Picture 5</div>
        </div>
        <div class="picture-item" onclick="selectPicture(6)">
          <img src="images/picture6.jpg" alt="Picture 6" class="picture-image" />
          <div class="picture-label">Picture 6</div>
        </div>
      </div>
      <button type="button" class="button" onclick="submitSelection()">Continue UwU</button>
    </fieldset>
  </div>
  
  <!-- Popup Modal -->
  <div id="messageModal" class="modal">
    <div class="modal-content">
      <div class="modal-message" id="modalMessage"></div>
      <button class="close-button" onclick="closeModal()">OK</button>
    </div>
  </div>
  
  <script>
    let selectedPicture = null;
    
    // Create falling paw prints
    const container = document.getElementById('fallingPaws');
    const numPaws = 30;
    
    for (let i = 0; i < numPaws; i++) {
      const paw = document.createElement('div');
      paw.className = 'paw';
      
      // Add toes to paw
      const toe1 = document.createElement('div');
      toe1.className = 'paw-toe-1';
      const toe2 = document.createElement('div');
      toe2.className = 'paw-toe-2';
      const toe3 = document.createElement('div');
      toe3.className = 'paw-toe-3';
      
      paw.appendChild(toe1);
      paw.appendChild(toe2);
      paw.appendChild(toe3);
      
      const leftPos = Math.random() * 100;
      const duration = 6 + Math.random() * 6;
      const delay = Math.random() * 5;
      const scale = 0.6 + Math.random() * 0.6;
      
      paw.style.left = `${leftPos}%`;
      paw.style.animationDuration = `${duration}s`;
      paw.style.animationDelay = `${delay}s`;
      paw.style.transform = `scale(${scale})`;
      paw.style.filter = `hue-rotate(${Math.random() * 30}deg)`;
      
      container.appendChild(paw);
    }
    
    function selectPicture(num) {
      // Remove previous selection
      document.querySelectorAll('.picture-item').forEach(item => {
        item.classList.remove('selected');
      });
      
      // Add selection to clicked item
      event.currentTarget.classList.add('selected');
      selectedPicture = num;
    }
    
    function submitSelection() {
      if (selectedPicture === null) {
        showModal("Please select a picture first! 💕");
        return;
      }
      
      let message = "";
      
      if (selectedPicture === 3) {
        message = "Good Girl 🥰💕";
      } else if (selectedPicture === 5) {
        message = "NENU MARI ANTHA EDAVA LAA KANIPISTUNNANA.. OKKA MAADIRIGA KUDA LEDHA 😤";
      } else {
        message = "YOU ARE GOING TO JAIL 🚨👮";
      }
      
      showModal(message);
    }
    
    function showModal(message) {
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('messageModal').style.display = 'block';
    }
    
    function closeModal() {
      document.getElementById('messageModal').style.display = 'none';
    }
    
    // Close modal when clicking outside of it
    window.onclick = function(event) {
      const modal = document.getElementById('messageModal');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
